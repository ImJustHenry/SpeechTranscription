name: Pylint

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]   # Use a fixed Python version
    steps:
      # Checkout repository including submodules
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      # Setup Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyaudio-wheels
          pip install -r requirements.txt --no-deps
          pip install pylint
          pip install --upgrade transformers   # Fixes use_auth_token lint issue

      # Run Pylint
      - name: Analyse code with Pylint
        run: |
          pylint_exit=0
          # Lint all Python files including submodules
          pylint --errors-only *.py $(git ls-files '*.py') || pylint_exit=$?
          if [ $pylint_exit -ne 0 ]; then
            echo "Pylint exited with code $pylint_exit"
            exit 1
          else
            echo "Pylint passed successfully."
          fi
