name: Build Saltify (Windows)

on:
  workflow_dispatch:   # Only runs when manually triggered from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Checkout repo including submodules
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Setup Python 3.11.7
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11.7

      # Install Java if not present
      - name: Install Java
        shell: powershell
        run: |
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            Write-Host "Java not found, installing JDK 11..."
            choco install jdk11 -y
          } else {
            Write-Host "Java is already installed."
          }

      # Install NLTK
      - name: Install NLTK
        run: |
          pip install nltk
          python -m nltk.downloader punkt

      # Cache Python packages
      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Install dependencies
      - run: pip install -r requirements.txt pyinstaller importlib-metadata sacremoses tokenizers

      # Upgrade transformers to fix use_auth_token issues
      - run: pip install --upgrade transformers

      # Uninstall typing to avoid conflicts
      - run: pip uninstall -y typing

      # Build with PyInstaller
      - run: >
          pyinstaller --name Saltify --windowed --noconfirm --onefile
          --copy-metadata torch
          --copy-metadata tqdm
          --copy-metadata regex
          --copy-metadata sacremoses
          --copy-metadata requests
          --copy-metadata packaging
          --copy-metadata filelock
          --copy-metadata numpy
          --copy-metadata tokenizers
          --copy-metadata importlib_metadata
          --collect-data sv_ttk
          --recursive-copy-metadata "openai-whisper"
          --collect-data whisper GUI.py

      # Copy additional assets
      - shell: cmd
        run: |
          robocopy build_assets dist/Saltify /e /v 
          mkdir dist\Saltify\_internal\lightning_fabric
          robocopy dist/Saltify/_internal/lightning dist/Saltify/_internal/lightning_fabric /e /v
          mkdir dist\Saltify\_internal\pattern\text\en\
          move dist/Saltify/en-model.slp dist/Saltify/_internal/pattern/text/en\

      # Upload built exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
