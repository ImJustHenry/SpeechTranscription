name: Build Saltify (Windows)

on:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Debug - List repo
        shell: powershell
        run: |
          Write-Host "Current directory: $(pwd)"
          Get-ChildItem
          Get-ChildItem CTkXYFrame

      # Setup Python
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Install Java (Chocolatey)
      - name: Install Java
        shell: powershell
        run: |
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
              choco install jdk11 -y
          } else {
              Write-Host "Java already installed."
          }

      - name: Check Java
        run: java -version

      # Cache pip
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/clips/pattern.git
          pip install -r requirements.txt
          pip install pyinstaller importlib-metadata sacremoses tokenizers

      - name: Install NLTK data
        run: python -m nltk.downloader punkt

      # Build EXE
      - name: Build Saltify EXE
        shell: cmd
        run: |
          pyinstaller --name Saltify --windowed --noconfirm --onefile ^
            --paths=CTkXYFrame ^
            --collect-submodules CTkXYFrame ^
            --add-data "CTkXYFrame;CTkXYFrame" ^
            --add-data "images;images" ^
            --collect-data pattern ^
            GUI.py

      # Run app headless for logging
      - name: Run app headless
        shell: cmd
        run: |
          set HEADLESS=true
          python GUI.py > app.log 2>&1 || exit /b 0

      # Upload logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows_Logs
          path: app.log

      # Upload EXE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
