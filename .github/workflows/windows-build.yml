name: Build Saltify (Windows)

on:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Checkout repo and submodules
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # <-- important for CTkXYFrame

      # Setup Python
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11.7

      # Install Java (for your other dependencies)
      - name: Install Java
        shell: powershell
        run: |
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            Write-Host "Java not found, installing JDK 11..."
            choco install jdk11 -y
          } else {
            Write-Host "Java is already installed."
          }

      # Install NLTK
      - name: Install NLTK
        run: |
          pip install nltk
          python -m nltk.downloader punkt

      # Cache Python packages
      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Install Python dependencies
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller importlib-metadata sacremoses tokenizers
          pip install --upgrade transformers
          pip uninstall -y typing

      # Build EXE with PyInstaller
      - name: Build EXE
        run: |
          pyinstaller --name Saltify --windowed --noconfirm --onefile -c --copy-metadata torch --copy-metadata tqdm --copy-metadata regex --copy-metadata sacremoses --copy-metadata requests --copy-metadata packaging --copy-metadata filelock --copy-metadata numpy --copy-metadata tokenizers --copy-metadata importlib_metadata --collect-data sv_ttk --recursive-copy-metadata "openai-whisper" --collect-data whisper --paths CTkXYFrame GUI.py

      # Copy assets
      - shell: cmd
        run: |
          robocopy build_assets dist/Saltify /e /v
          mkdir dist\Saltify\_internal\lightning_fabric
          robocopy dist\Saltify/_internal/lightning dist\Saltify/_internal/lightning_fabric /e /v
          mkdir dist\Saltify\_internal\pattern\text\en\
          move dist\Saltify\en-model.slp dist\Saltify\_internal\pattern\text\en\

      # Run app for logging
      - name: Run app for logging
        run: |
          set HEADLESS=true
          python GUI.py > app.log 2>&1 || true

      # Upload logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_logs
          path: app.log

      # Upload EXE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
