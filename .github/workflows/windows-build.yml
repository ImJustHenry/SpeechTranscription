name: Build Saltify (Windows)

on:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging
      - feature/githubRelease
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Checkout repo with submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Install Java
      - name: Install Java
        shell: powershell
        run: |
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            Write-Host "Java not found, installing JDK 11..."
            choco install jdk11 -y
          } else {
            Write-Host "Java is already installed."
          }

      # Install NLTK
      - name: Install NLTK
        run: |
          pip install nltk
          python -m nltk.downloader punkt

      # Cache Python packages
      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Install Python dependencies including CTkXYFrame
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller importlib-metadata sacremoses tokenizers
          pip install --upgrade transformers
          pip uninstall -y typing || true
          REM # CTkXYFrame has no setup.py, so manually copy after cloning
          git clone https://github.com/Akascape/CTkXYFrame.git _submodules/CTkXYFrame

      # Verify CTkXYFrame
      - name: Verify CTkXYFrame
        run: |
          python -c "import sys; sys.path.insert(0, '_submodules/CTkXYFrame'); import CTkXYFrame; print('CTkXYFrame loaded successfully')"

      # Build EXE with PyInstaller
      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller --name Saltify --windowed --noconfirm --onefile ^
            --copy-metadata torch ^
            --copy-metadata tqdm ^
            --copy-metadata regex ^
            --copy-metadata sacremoses ^
            --copy-metadata requests ^
            --copy-metadata packaging ^
            --copy-metadata filelock ^
            --copy-metadata numpy ^
            --copy-metadata tokenizers ^
            --copy-metadata importlib_metadata ^
            --collect-data sv_ttk ^
            --recursive-copy-metadata "openai-whisper" ^
            --collect-data whisper ^
            --collect-all CTkXYFrame ^
            --hidden-import CTkXYFrame ^
            GUI.py

      # Copy extra assets safely
      - name: Copy assets
        shell: cmd
        run: |
          robocopy build_assets dist/Saltify /e /v
          mkdir dist\Saltify\_internal\lightning_fabric
          if exist dist\Saltify\_internal\lightning (
            robocopy dist\Saltify\_internal\lightning dist\Saltify\_internal\lightning_fabric /e /v
          ) else (
            echo "_internal\lightning folder missing, skipping copy"
          )
          mkdir dist\Saltify\_internal\pattern\text\en\
          move dist\Saltify/en-model.slp dist\Saltify\_internal\pattern\text\en\

      # Upload artifact
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
