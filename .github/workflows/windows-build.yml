name: Build Saltify (Windows)

on:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Checkout repository and submodules
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      # Debug: verify repo structure
      - name: Debug - List repo and submodules
        shell: powershell
        run: |
          Write-Host "Current directory: $(pwd)"
          Get-ChildItem
          Write-Host "`nSubmodule (CTkXYFrame) contents:"
          Get-ChildItem CTkXYFrame

      # Setup Python 3.11
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Download and extract portable JRE
      - name: Download portable JRE
        shell: powershell
        run: |
          $jreUrl = "https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u462-b08/OpenJDK8U-jre_x64_windows_hotspot_8u462b08.zip"
          $jreZip = "$env:TEMP\jre.zip"
          Invoke-WebRequest -Uri $jreUrl -OutFile $jreZip
          Expand-Archive -Path $jreZip -DestinationPath "$env:USERPROFILE\jre_portable" -Force
          Remove-Item $jreZip
          Write-Host "JRE extracted to $env:USERPROFILE\jre_portable"

      # Set JAVA_HOME and update PATH
      - name: Configure Java environment
        shell: powershell
        run: |
          $javaPath = Get-ChildItem "$env:USERPROFILE\jre_portable" | Select-Object -First 1
          Write-Host "Using JRE: $javaPath"
          echo "JAVA_HOME=$javaPath" >> $env:GITHUB_ENV
          echo "$javaPath\bin" >> $env:GITHUB_PATH

      # Cache pip packages
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/clips/pattern.git
          pip install -r requirements.txt
          pip install pyinstaller importlib-metadata sacremoses tokenizers
          pip uninstall -y typing || echo "No old typing package found"

      # NLTK data (punkt)
      - name: Install NLTK data
        run: python -m nltk.downloader punkt

      # Debug: Verify imports
      - name: Debug - Test imports
        run: python -c "import pattern, customtkinter, CTkXYFrame; print('All imports successful!')"

      # Build EXE with PyInstaller
      - name: Build Saltify EXE
        shell: cmd
        run: |
          pyinstaller --name Saltify --windowed --noconfirm --onefile ^
            --paths=CTkXYFrame ^
            --collect-submodules CTkXYFrame ^
            --add-data "CTkXYFrame;CTkXYFrame" ^
            --add-data "images;images" ^
            --collect-data pattern ^
            --copy-metadata torch ^
            --copy-metadata tqdm ^
            --copy-metadata regex ^
            --copy-metadata sacremoses ^
            --copy-metadata requests ^
            --copy-metadata packaging ^
            --copy-metadata filelock ^
            --copy-metadata numpy ^
            --copy-metadata tokenizers ^
            --copy-metadata importlib_metadata ^
            --collect-data sv_ttk ^
            --recursive-copy-metadata "openai-whisper" ^
            --collect-data whisper ^
            GUI.py

      # Run app for logging (headless mode)
      - name: Run app for logging
        shell: cmd
        run: |
          set HEADLESS=true
          python GUI.py > app.log 2>&1 || exit /b 0

      # Upload logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows_Logs
          path: app.log

      # Upload final EXE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
