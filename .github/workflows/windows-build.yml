name: Build Saltify (Windows)

on:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # Checkout repository and submodules
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      # Debug: verify repo structure
      - name: Debug - List repo
        shell: powershell
        run: |
          Write-Host "Current directory: $(pwd)"
          Get-ChildItem
          Get-ChildItem CTkXYFrame

      # Setup Python 3.11
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # Install FFmpeg using Chocolatey
      - name: Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y
          $env:PATH += ";C:\ProgramData\chocolatey\bin"
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV

      # Verify FFmpeg installation
      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      # Install Java using Chocolatey (required for language-tool-python)
      - name: Install Java
        shell: powershell
        run: |
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
              choco install jdk11 -y
          } else {
              Write-Host "Java already installed."
          }

      # Verify Java installation
      - name: Check Java
        run: java -version

      # Download LanguageTool and configure environment
      - name: Download LanguageTool
        shell: powershell
        run: |
          $ltUrl = "https://languagetool.org/download/LanguageTool-stable.zip"
          $ltZip = "$env:TEMP\LanguageTool.zip"
          Invoke-WebRequest -Uri $ltUrl -OutFile $ltZip
          Expand-Archive -Path $ltZip -DestinationPath "$env:USERPROFILE\LanguageTool" -Force
          Remove-Item $ltZip

      - name: Configure LanguageTool path
        shell: powershell
        run: |
          $ltFolder = Get-ChildItem "$env:USERPROFILE\LanguageTool" | Select-Object -First 1
          $ltJar = Join-Path $ltFolder.FullName "languagetool-server.jar"
          echo "LANGUAGE_TOOL_PATH=$ltJar" >> $env:GITHUB_ENV

      # Cache pip packages
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/clips/pattern.git
          pip install -r requirements.txt
          pip install pyinstaller importlib-metadata sacremoses tokenizers
          pip uninstall -y typing || echo "No old typing package found"

      # Install NLTK data (punkt tokenizer)
      - name: Install NLTK data
        run: python -m nltk.downloader punkt

      # Debug: verify imports
      - name: Debug - Test imports
        run: python -c "import pattern, customtkinter, CTkXYFrame; print('All imports successful!')"

      # Build EXE with PyInstaller (includes pyannote.audio fix)
      - name: Build Saltify EXE
        shell: cmd
        run: |
          for /f "delims=" %%i in ('python -c "import os, pyannote.audio; print(os.path.join(os.path.dirname(pyannote.audio.__file__), 'telemetry', 'config.yaml'))"') do set CFG=%%i
          pyinstaller --name Saltify --console --noconfirm --onefile ^
            --paths=CTkXYFrame ^
            --collect-submodules CTkXYFrame ^
            --add-data "CTkXYFrame;CTkXYFrame" ^
            --add-data "images;images" ^
            --add-data "%CFG%;pyannote/audio/telemetry" ^
            --collect-data pattern ^
            GUI.py

      # Upload final EXE artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
