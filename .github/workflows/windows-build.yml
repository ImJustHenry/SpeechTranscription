name: Build Saltify (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging
      - feature/githubRelease

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Java
        shell: powershell
        run: |
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            Write-Host "Java not found, installing JDK 11..."
            choco install jdk11 -y
          } else {
            Write-Host "Java is already installed."
          }

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller importlib-metadata sacremoses tokenizers transformers
          pip uninstall -y typing || true
          # Manually install CTkXYFrame (since repo has no setup.py)
          git clone https://github.com/Akascape/CTkXYFrame.git
          pip install ./CTkXYFrame

      - name: Verify CTkXYFrame installation
        run: |
          python -c "import CTkXYFrame; print('CTkXYFrame installed at:', CTkXYFrame.__file__)"

      - name: Build Saltify EXE (No-OneFile)
        shell: bash
        run: |
          pyinstaller ^
            --name Saltify ^
            --windowed ^
            --noconfirm ^
            --collect-data sv_ttk ^
            --collect-data whisper ^
            --collect-all CTkXYFrame ^
            --hidden-import CTkXYFrame ^
            --copy-metadata torch ^
            --copy-metadata tqdm ^
            --copy-metadata regex ^
            --copy-metadata sacremoses ^
            --copy-metadata requests ^
            --copy-metadata packaging ^
            --copy-metadata filelock ^
            --copy-metadata numpy ^
            --copy-metadata tokenizers ^
            --copy-metadata importlib_metadata ^
            GUI.py

      - name: Copy assets (images, ffmpeg, internal data)
        shell: cmd
        run: |
          mkdir dist\Saltify\_internal
          if exist build_assets robocopy build_assets dist\Saltify\build_assets /e /v
          if exist ffmpeg.exe copy ffmpeg.exe dist\Saltify\
          if exist images robocopy images dist\Saltify\images /e /v

      - name: Upload Saltify folder
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify
